services:
  nuvioweb:
    container_name: nuvioweb
    image: ghcr.io/alphasquare404/nuvioweb:stable
    environment:
      NUVIO_SUPABASE_URL: ${NUVIO_SUPABASE_URL:-}
      NUVIO_SUPABASE_ANON_KEY: ${NUVIO_SUPABASE_ANON_KEY:-}
      NUVIO_SUPABASE_FALLBACK_URL: ${NUVIO_SUPABASE_FALLBACK_URL:-}
      YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL:-youtube-proxy.html}
      TV_LOGIN_WEB_BASE_URL: ${TV_LOGIN_WEB_BASE_URL:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      INTRODB_API_URL: "${INTRODB_API_URL:-https://api.introdb.app/}"
      IMDB_RATINGS_API_BASE_URL: ${IMDB_RATINGS_API_BASE_URL:-}
      IMDB_TAPFRAME_API_BASE_URL: ${IMDB_TAPFRAME_API_BASE_URL:-}
      AVATAR_PUBLIC_BASE_URL: ${AVATAR_PUBLIC_BASE_URL:-}
      UNIQUE_CONTRIBUTIONS_BASE_URL: ${UNIQUE_CONTRIBUTIONS_BASE_URL:-}
      DONATIONS_BASE_URL: ${DONATIONS_BASE_URL:-}
      DONATIONS_DONATE_URL: ${DONATIONS_DONATE_URL:-}
      SPONSOR_NAMES: ${SPONSOR_NAMES:-ragmehos.}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:-}
      SIMKL_APP_NAME: ${SIMKL_APP_NAME:-nuvio}
      PREMIUMIZE_CLIENT_ID: ${PREMIUMIZE_CLIENT_ID:-}
      AUTOMATION_SHORTCUT_URL: ${AUTOMATION_SHORTCUT_URL:-}
      # Relays the browser cannot reach by itself. Empty means the deployment
      # does not offer one, and the app then never calls it.
      PROBE_MODE: ${PROBE_MODE:-}
      PROBE_CLIENT_CONCURRENCY: ${PROBE_CLIENT_CONCURRENCY:-1}
      MEDIA_URL_HOST_RESOLVE_ENABLED: ${MEDIA_URL_HOST_RESOLVE_ENABLED:-false}
      PROBE_ENABLED: ${PROBE_ENABLED:-true}
      PROBE_ENDPOINT: ${PROBE_ENDPOINT:-}
      REMUX_MODE: ${REMUX_MODE:-}
      REMUX_CLIENT_CACHE_MAX_MIB: ${REMUX_CLIENT_CACHE_MAX_MIB:-512}
      REMUX_ENDPOINT: ${REMUX_ENDPOINT:-}
      TRANSCODE_ENDPOINT: ${TRANSCODE_ENDPOINT:-}
      TRANSCODE_MODE: ${TRANSCODE_MODE:-}
    ports:
      - "${NUVIO_PORT:-4173}:80"
    restart: unless-stopped

  trakt-auth-bridge:
    container_name: nuvioweb-trakt-auth-bridge
    image: ghcr.io/alphasquare404/nuvioweb-trakt-auth-bridge:stable
    environment:
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
      TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI:-urn:ietf:wg:oauth:2.0:oob}
    restart: unless-stopped

  mdblist-bridge:
    container_name: nuvioweb-mdblist-bridge
    image: ghcr.io/alphasquare404/nuvioweb-mdblist-bridge:stable
    environment:
      MDBLIST_CLIENT_ID: ${MDBLIST_CLIENT_ID:-}
    restart: unless-stopped

  debrid-api-bridge:
    container_name: nuvioweb-debrid-api-bridge
    image: ghcr.io/alphasquare404/nuvioweb-debrid-api-bridge:stable
    environment:
      NUVIO_SUPABASE_URL: ${NUVIO_SUPABASE_URL:-}
      NUVIO_SUPABASE_ANON_KEY: ${NUVIO_SUPABASE_ANON_KEY:-}
      MEDIA_URL_HOST_RESOLVE_ENABLED: ${MEDIA_URL_HOST_RESOLVE_ENABLED:-false}
    restart: unless-stopped

  external-return-bridge:
    container_name: nuvioweb-external-return-bridge
    image: ghcr.io/alphasquare404/nuvioweb-external-return-bridge:stable
    restart: unless-stopped
    environment:
      NUVIO_WEB_PUSH_PUBLIC_KEY: ${NUVIO_WEB_PUSH_PUBLIC_KEY:-}
      NUVIO_WEB_PUSH_PRIVATE_KEY: ${NUVIO_WEB_PUSH_PRIVATE_KEY:-}
      NUVIO_WEB_PUSH_SUBJECT: ${NUVIO_WEB_PUSH_SUBJECT:-}

  # Runs ffmpeg, so it is the one service whose work has to be rationed: which
  # callers may ask is a deployment decision, and `token` fails closed when no
  # token is configured. Reached only through nginx on /api/transcode.
  transcode-bridge:
    container_name: nuvioweb-transcode-bridge
    image: ghcr.io/alphasquare404/nuvioweb-transcode-bridge:stable
    restart: unless-stopped
    environment:
      # open (anyone), token (shared secret), lan (private addresses only).
      TRANSCODE_ACCESS: ${TRANSCODE_ACCESS:-token}
      TRANSCODE_MODE: ${TRANSCODE_MODE:-}
      TRANSCODE_TOKEN: ${TRANSCODE_TOKEN:-}
      TRANSCODE_TIMEOUT_MS: ${TRANSCODE_TIMEOUT_MS:-3600000}
      TRANSCODE_MAX_CONCURRENT: ${TRANSCODE_MAX_CONCURRENT:-1}
      TRANSCODE_PER_IP_CONCURRENT: ${TRANSCODE_PER_IP_CONCURRENT:-1}
      TRANSCODE_AUDIO_BITRATE: ${TRANSCODE_AUDIO_BITRATE:-192k}
      # Optional executable path inside this container. The image includes FFmpeg.
      FFMPEG_PATH: ${FFMPEG_PATH:-}
    volumes:
      # A finished transcode is what the next seek reads, so it outlives the
      # container. The bridge sweeps its own files by age.
      - transcode-work:/tmp/nuvio-transcode

volumes:
  transcode-work:
