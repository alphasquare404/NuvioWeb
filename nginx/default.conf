server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Browser configuration can change between image builds and must not be
    # served from a stale cache. It contains only public browser values.
    location = /nuvio.env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Build assets are not content-hashed, so use a bounded cache lifetime
    # rather than an irreversible immutable cache directive.
    location ~* \.(?:css|js|mjs|wasm|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Supports direct browser requests for current and future SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
