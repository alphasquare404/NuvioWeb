server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Browser configuration can change between image builds and must not be
    # served from a stale cache. It contains only public browser values.
    location = /nuvio.env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The manifest is deployment metadata, not a content-hashed build asset.
    # Serve the standard type explicitly for Chromium installability checks.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The worker is how a new build reaches an installed PWA. Under the
    # seven-day static-asset rule below, a worker file that a cache keeps is a
    # fix that waits for the cache to expire, so it is revalidated every time.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # OAuth token operations require the confidential Trakt client secret.
    # Keep them same-origin, but route them only to the internal bridge.
    location ^~ /api/trakt/ {
        proxy_pass http://trakt-auth-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # MDBList OAuth and tracking requests need a same-origin hop: the provider
    # does not answer browser preflights for bearer-authenticated writes.
    location ^~ /api/mdblist/ {
        proxy_pass http://mdblist-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location = /api/debrid/plugin/fetch {
        access_log off;
        client_max_body_size 2m;
        client_body_timeout 10s;
        proxy_pass http://debrid-api-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 20s;
    }

    # Connected Services requests use a fixed, same-origin provider allowlist.
    location ^~ /api/debrid/ {
        proxy_pass http://debrid-api-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    # Outplayer may append a signed media URL to its callback query. Keep this
    # narrowly scoped route out of the default request-URI access log.
    location ^~ /api/external-return/ {
        access_log off;
        proxy_pass http://external-return-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # IntroDB answers with Access-Control-Allow-Origin: https://introdb.app, so a
    # browser on any other origin cannot read its segment data and skip-intro
    # silently has nothing to offer. Relaying the same path here makes the request
    # same-origin, which removes CORS from the picture entirely.
    #
    # Enable it by pointing the app at this path: INTRODB_API_URL=/api/introdb/
    location ^~ /api/introdb/ {
        proxy_pass https://api.introdb.app/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.introdb.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Audio transcoding copies the picture and re-encodes only the audio track. It
    # is the one relay here that can hold the machine for minutes, so it gets its
    # own route: long timeouts, no buffering of an answer that is only written once
    # the work is finished, and no access log. The log matters because a <video>
    # element cannot send an Authorization header, so the shared token travels in
    # the query string and would otherwise be written down on every playback.
    location ^~ /api/transcode {
        access_log off;
        proxy_pass http://transcode-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Build assets are not content-hashed, so use a bounded cache lifetime
    # rather than an irreversible immutable cache directive.
    location ~* \.(?:css|js|mjs|wasm|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Supports direct browser requests for current and future SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
