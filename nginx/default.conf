server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Browser configuration can change between image builds and must not be
    # served from a stale cache. It contains only public browser values.
    location = /nuvio.env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The manifest is deployment metadata, not a content-hashed build asset.
    # Serve the standard type explicitly for Chromium installability checks.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # OAuth token operations require the confidential Trakt client secret.
    # Keep them same-origin, but route them only to the internal bridge.
    location ^~ /api/trakt/ {
        proxy_pass http://trakt-auth-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Connected Services requests use a fixed, same-origin provider allowlist.
    location ^~ /api/debrid/ {
        proxy_pass http://debrid-api-bridge:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    # Build assets are not content-hashed, so use a bounded cache lifetime
    # rather than an irreversible immutable cache directive.
    location ~* \.(?:css|js|mjs|wasm|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Supports direct browser requests for current and future SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
